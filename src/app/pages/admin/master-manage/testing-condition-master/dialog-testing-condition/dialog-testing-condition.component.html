<div fxLayoutAlign="center stretch" fxLayout="row wrap">
    <h4 fxFlex="100">Testing Condition</h4>
    <mat-form-field fxFlex="100" appearance="fill">
        <mat-label>Name</mat-label>
        <input matInput [(ngModel)]="testingCondition.name">
    </mat-form-field>
    <mat-form-field fxFlex="100" appearance="fill">
        <mat-label>List Name</mat-label>
        <mat-chip-grid #chipList>
            <mat-chip-row *ngFor="let list of testingCondition.list" (removed)="remove(list)">
                {{list.name}}
                <button matChipRemove>
                    <mat-icon>cancel</mat-icon>
                </button>
            </mat-chip-row>
        </mat-chip-grid>

            (matChipInputTokenEnd)="add($event)" />
        <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)">
            @for (fruit of testingCondition.list | async; track fruit) {
            <mat-option [value]="fruit">{{fruit}}</mat-option>
            }
        </mat-autocomplete> -->

                (matChipInputTokenEnd)="add($event)">
        </mat-chip-list> -->
    </mat-form-field>
    <ng-container *ngIf="data; else elseTemplate">
        <button fxFlex="100" mat-raised-button color="primary" (click)="onSubmit()">
            edit
        </button>
    </ng-container>
    <ng-template #elseTemplate>
        <button fxFlex="100" mat-raised-button color="primary" (click)="onSubmit()">
            add
        </button>
    </ng-template>


</div>
